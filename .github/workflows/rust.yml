name: Rust Build & Test

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

# Cancel superseded runs — RocksDB compiles are expensive on 2-core runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: ${{ matrix.os }} ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        package: [sidecar, client-cli]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            **/target
          key: ${{ runner.os }}-cargo-${{ matrix.package }}-${{ hashFiles(format('{0}/Cargo.toml', matrix.package)) }}

      - name: Build ${{ matrix.package }}
        run: cargo build
        working-directory: ${{ matrix.package }}

      # `cargo test` links the huge RocksDB lib (~40+ min on GitHub's 2-core
      # runners), so CI type-checks the tests instead. Run `cargo test`
      # locally for the full unit + integration coverage.
      - name: Type-check tests
        run: cargo check --tests
        working-directory: ${{ matrix.package }}

      - name: Clippy ${{ matrix.package }}
        run: cargo clippy ${{ matrix.package == 'sidecar' && '--lib --bins' || '--bins' }} -- -D warnings
        working-directory: ${{ matrix.package }}
